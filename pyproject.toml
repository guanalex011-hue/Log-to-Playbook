[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "log-to-playbook"
version = "0.1.0"
description = "Turn logs and stack traces into practical debugging playbooks."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Log-to-Playbook Contributors" }
]
dependencies = [
  "PyYAML>=6.0.1"
]
keywords = ["logs", "debugging", "playbooks", "cli", "diagnostics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Logging"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "build>=1.2"
]

[project.scripts]
log2playbook = "log_to_playbook.cli:main"

[project.urls]
Homepage = "https://github.com/guanalex011-hue/Log-to-Playbook"
Repository = "https://github.com/guanalex011-hue/Log-to-Playbook"
Issues = "https://github.com/guanalex011-hue/Log-to-Playbook/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/log_to_playbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
